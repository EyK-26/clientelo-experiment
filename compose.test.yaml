name: investicni-prehled-tests

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clientelo_native_test
      POSTGRES_USER: clientelo_native_test_owner
      POSTGRES_PASSWORD: local-owner-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./tests/support/init-local-database.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientelo_native_test_owner -d clientelo_native_test"]
      interval: 2s
      timeout: 2s
      retries: 20
