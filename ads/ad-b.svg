<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">Reklamní návrh B — SPY a VOO</title><desc id="desc">ETF na burze. Dostupné i u vašeho brokera? Otázky pro brokera na příkladu SPY a VOO. Vzdělávací srovnání, dostupnost pro konkrétní účet není ověřena.</desc><rect width="1080" height="1080" fill="#f4f3ec"/><g font-family="Arial, sans-serif" fill="#182c28"><text x="72" y="82" font-size="34" font-weight="700">Investiční přehled</text><text x="72" y="137" font-size="23">NÁVRH · OSOBNÍ DEMONSTRACE</text><text x="72" y="255" font-size="76" font-weight="700">ETF na burze.</text><text x="72" y="353" font-size="76" font-weight="700">Dostupné i u</text><text x="72" y="451" font-size="76" font-weight="700">vašeho brokera?</text><text x="72" y="588" font-size="36">Otázky pro brokera na příkladu SPY a VOO.</text><rect x="72" y="650" width="936" height="112" fill="#e5eddb"/><text x="102" y="718" font-size="36" font-weight="700">SPY / VOO · S&amp;P 500 · NYSE Arca</text><rect x="72" y="804" width="650" height="82" rx="5" fill="#075c4c"/><text x="102" y="858" font-size="36" fill="white">Prohlédnout ukázku listu →</text><text x="72" y="948" font-size="36">Dostupnost závisí na účtu, brokerovi a KID.</text><text x="72" y="989" font-size="36">Vzdělávací obsah. Nejde o doporučení k nákupu.</text></g></svg>
